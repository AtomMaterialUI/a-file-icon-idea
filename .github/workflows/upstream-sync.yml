name: Upstream Icon Sync

# Reports which icon-related issues/PRs from the upstream
# material-extensions/vscode-material-icon-theme repository do not yet appear to
# be ported into this repo's association XML files. The committed state file
# ensures repeat runs only surface new / still-unresolved items.

on:
  schedule:
    # Weekly, Mondays at 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      include_closed:
        description: 'Also scan closed/merged upstream items'
        required: false
        default: 'false'

permissions:
  contents: write
  issues: write

jobs:
  sync:
    name: Check upstream icon requests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run upstream check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXTRA=""
          if [[ "${{ github.event.inputs.include_closed }}" == "true" ]]; then
            EXTRA="--include-closed"
          fi
          node scripts/upstream-sync/check-upstream.mjs \
            --write-state \
            --report upstream-report.md \
            $EXTRA

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: upstream-icon-report
          path: upstream-report.md

      - name: Publish / update tracking issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Upstream icon sync report"
          BODY_FILE=upstream-report.md
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" \
            --state open --label upstream-sync --search "$TITLE in:title" \
            --json number --jq '.[0].number' || echo "")
          if [[ -n "$EXISTING" ]]; then
            gh issue edit "$EXISTING" --repo "$GITHUB_REPOSITORY" --body-file "$BODY_FILE"
          else
            gh label create upstream-sync --repo "$GITHUB_REPOSITORY" --color BFDADC \
              --description "Automated upstream icon sync tracking" || true
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" --label upstream-sync --body-file "$BODY_FILE"
          fi

      - name: Commit refreshed state
        run: |
          if [[ -n "$(git status --porcelain scripts/upstream-sync/state.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add scripts/upstream-sync/state.json
            git commit -m "chore: refresh upstream icon sync state"
            git push
          fi
